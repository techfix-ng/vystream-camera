name: Build Multi-Receiver Android APK

on:
  push:
    branches:
      - feature/android-multi-receiver-v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test discovery and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testFossDebugUnitTest :app:assembleFossDebug

      - name: Stage direct-download APK
        run: |
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk VYSTREAM-Camera-Multi-Receiver-v3.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VYSTREAM-Camera-Multi-Receiver
          path: VYSTREAM-Camera-Multi-Receiver-v3.0.0.apk

      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view multi-receiver-v3.0.0 >/dev/null 2>&1 || gh release create multi-receiver-v3.0.0 --prerelease --target "$GITHUB_SHA" --title "VYSTREAM Multi-Receiver v3.0.0" --notes "Windows OBS plugin and Android camera multi-receiver test build."
          gh release upload multi-receiver-v3.0.0 VYSTREAM-Camera-Multi-Receiver-v3.0.0.apk --clobber
