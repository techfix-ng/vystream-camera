name: Publish VYSTRM Camera APK

on:
  # A push with the publish commit message creates the single APK release.
  push:
    branches: [ vystream-ui-endpoint-fixes ]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish VYSTRM Camera APK hotlink'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build VYSTRM Camera
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGmsDebug
          cp app/build/outputs/apk/gms/debug/app-gms-debug.apk VYSTRM-Camera-v2.9.3.apk

      - name: Publish direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.3-vystream
          name: VYSTRM Camera v2.9.3
          body: VYSTRM Camera Android build with instant no-popup resolution switching, stable portrait Settings navigation, landscape-locked preview, automatic OBS endpoint discovery, and Firebase-enabled GMS services.
          files: VYSTRM-Camera-v2.9.3.apk
          fail_on_unmatched_files: true
